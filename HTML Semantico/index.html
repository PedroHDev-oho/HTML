<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML 5 - Estrutural</title>
</head>
<body>
    <header>
        <h1>No Header vai o cabeçalho da pagina</h1>
    </header>
    <main>
        <p>No main, vai o conteudo principal e não pode ser filha de nenhuma outras tags anteriores</p>
    </main>
    <footer>
        <p>É o rodapé da nossa pagina</p>
    </footer>

    <section>
        <p>É uma seção de uma pesquisa, tipo uma DIV</p>
    </section>
    <Aside>
        <p>Refere-se a um assunto fora do topico principal</p>
    </Aside>
</body>
</html>
