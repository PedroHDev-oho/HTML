<!--
    Tag form
    Tag input
    Tag checkbox e radio
    Tag select e option
    Tag textarea
    Tag button
-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
</head>
<body>
    <form name="signup" action="#" method="post" autocomplete="off">
        Nome: <input type="text" name="nome" id="nome"><br>
        Idade: <input type="number" name="idade" id="idade"><br>
        Senha: <input type="password" name="senha" id="senha"><br>
        button: <input type="submit" value="Enviar"><br>
    </form>
    <form>
        <label>Text: </label> <input type="text"><br>
        <label>Number: </label> <input type="number" min="0" max="100" step="5"><br>
        <label>Button: </label> <input type="button" value="Enviar"><br>
        <label>Range: </label> <input type="range" min="0" max="100"><br>
        <label>Color: </label> <input type="color"><br>
        <label>E-mail: </label> <input type="email"><br>
        <label>Url: </label> <input type="url"><br>
        <label>Data: </label> <input type="date"><br>
        <label>CheckBox: </label> <input type="checkbox"><br>
        <label>Radio: </label> <input type="radio"><br>
        <label>Hidden: </label> <input type="hidden"><br>
        <label>File: </label> <input type="file" multiple><br>
        <label>Search: </label> <input type="search"><br>

    </form>

</body>
</html>
